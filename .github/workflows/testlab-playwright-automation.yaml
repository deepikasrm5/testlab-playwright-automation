name: Testlab playwright automation Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]       # Triggers when PR is raised against main

  schedule:
    - cron: '30 4 * * 1,3,5'   # Runs on Monday, Wednesday, Friday 10 AM IST (4:30 AM UTC)

  workflow_dispatch:        # Manual trigger from GitHub Actions UI

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: true
      BROWSER: chromium
      BASE_URL: ${{ secrets.BASE_URL }}
      VALID_USERNAME: ${{ secrets.VALID_USERNAME }}
      VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
      INVALID_USERNAME: ${{ secrets.INVALID_USERNAME }}
      INVALID_PASSWORD: ${{ secrets.INVALID_PASSWORD }}
      XSS_USERNAME: ${{secrets.XSS_USERNAME}}
      XSS_PASSWORD: ${{secrets.XSS_PASSWORD}}

    steps:
      # Step 1: Checkout code from the branch
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js with npm cache
      # cache: 'npm' speeds up installs by caching node_modules
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'    # ← just major version, no .nvmrc needed
          cache: 'npm'

      # Step 3: Install project dependencies
      # npm ci is used instead of npm install
      # because ci does clean install and respects package-lock.json exactly
      - name: Install dependencies
        run: npm ci

      # Step 4: Install Playwright browsers
      # --with-deps installs OS level dependencies needed for chromium on Ubuntu
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Step 5: Run Playwright tests
      - name: Run Playwright tests
        run: npx playwright test

      # Generate Allure report
      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      # Deploy to GitHub Pages
      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages